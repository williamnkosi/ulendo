name: ulendo_workspace
publish_to: none
environment:
  sdk: ^3.13.2

workspace:
  - apps/rider_app
  - apps/driver_app
  - packages/ulendo_core
  - packages/ulendo_ui
  - packages/ulendo_models

dev_dependencies:
  melos: ^7.3.0

melos:
  scripts:
    run:rider:
      run: cd apps/rider_app && flutter run
      description: Run the Rider App locally.
    run:driver:
      run: cd apps/driver_app && flutter run
      description: Run the Driver App locally.
